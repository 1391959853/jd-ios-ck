<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服务监控</title>
    <link rel="stylesheet" href="/static/style.css?v=20260816">
</head>
<body>
    <div class="app">
        <!-- 头部 -->
        <header class="app-header">
            <div class="logo">
                <div class="logo-icon">●</div>
                <h1>Monitor</h1>
            </div>
            <div class="header-actions">
                <div class="last-update" id="last-update">--:--:--</div>
                <button id="refresh-btn" title="刷新">↻</button>
            </div>
        </header>

        <!-- 整体状态 -->
        <div class="section">
            <div id="overall-status">
                <div class="status-indicator"></div>
                <div class="status-info">
                    <h2 id="overall-title">加载中...</h2>
                    <p id="overall-desc">正在读取监控数据</p>
                </div>
            </div>
        </div>

        <!-- 目标服务 -->
        <div class="section">
            <div class="section-header">
                <span class="section-icon">◆</span>
                <h2>目标服务</h2>
            </div>
            <div class="target-list" id="target-services">
            </div>
        </div>

        <!-- 统计 -->
        <div class="section">
            <div class="section-header">
                <span class="section-icon">◆</span>
                <h2>代理统计</h2>
            </div>
            <div class="stats-row">
                <div class="stat-item">
                    <div class="stat-value" id="total-groups">0</div>
                    <div class="stat-label">总组数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="healthy-groups">0</div>
                    <div class="stat-label">健康</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="main-count">0</div>
                    <div class="stat-label">主容器</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="socks5-count">0</div>
                    <div class="stat-label">SOCKS5</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="ssh-count">0</div>
                    <div class="stat-label">SSH</div>
                </div>
            </div>
        </div>

        <!-- 代理组 -->
        <div class="section">
            <div class="section-header">
                <span class="section-icon">◆</span>
                <h2>代理组</h2>
                <span class="badge" id="group-badge">0</span>
            </div>
            <div class="groups-grid" id="proxy-groups">
            </div>
        </div>

        <!-- 底部 -->
        <footer class="app-footer">
            <div class="footer-dot"></div>
            <p>MOMITOR</p>
        </footer>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
