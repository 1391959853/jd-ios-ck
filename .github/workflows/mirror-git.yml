name: github前缀代理测试

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      socks_host:
        description: 'SOCKS5 代理主机'
        required: true
        default: '1.sggg3326.top'
      socks_port:
        description: 'SOCKS5 代理端口'
        required: true
        default: '6005'

jobs:
  speed-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 测试代理连通性
        run: |
          curl -x socks5h://socksuser:sockspass123@${{ github.event.inputs.socks_host || '1.sggg3326.top' }}:${{ github.event.inputs.socks_port || '6005' }} \
          -I https://httpbin.org/ip

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install requests requests[socks] PySocks

      - name: Run speed test (with SOCKS5)
        env:
          SOCKS5_HOST: ${{ github.event.inputs.socks_host || '1.sggg3326.top' }}
          SOCKS5_PORT: ${{ github.event.inputs.socks_port || '6005' }}
        run: |
          python3 github_mirror_speed_test.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: speed-test-results
          path: speed_test_results.txt

      # ========== 新增：提交结果到仓库根目录 ==========
      - name: 提交结果到仓库（覆盖）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add speed_test_results.txt
          git diff --cached --quiet || git commit -m "更新测速结果 [skip ci]"
          git push origin X

      - name: Show best mirror
        run: |
          echo "🏆 测试完成！查看仓库根目录的 speed_test_results.txt"
