name: Docker Mirror Speed Test

on:
  schedule:
    - cron: '0 3 * * *'   # 每天北京时间 11:00
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: pip install requests

      - name: Run Docker mirror speed test
        run: python3 docker_mirror_speed_test.py

      - name: Upload results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-mirror-results
          path: |
            docker_mirror_results.txt
            daemon.json

      - name: Commit results to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add docker_mirror_results.txt daemon.json
          git diff --cached --quiet || git commit -m "更新Docker镜像测速结果和配置文件 [skip ci]"
          git push origin main