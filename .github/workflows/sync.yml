name: Sync QX Rules

on:
  schedule:
    - cron: '0 22 * * *'      # 每天 UTC 22:00（北京时间 06:00）
  workflow_dispatch:           # 支持手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: 检出当前仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          # 无需额外依赖，仅使用标准库

      - name: 执行同步脚本
        run: python sync.py

      - name: 提交并推送变更
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-sync qx rules from upstream"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
